services:
  # FastAPI Backend
  - type: web
    name: data-insight-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: data-insight-db
          property: connectionString
      - key: READONLY_DB_USER
        value: readonly_user
      - key: READONLY_DB_PASSWORD
        generateValue: true
      - key: READONLY_DATABASE_URL
        # This is constructed from the managed DB host + readonly credentials.
        # Render doesn't support dynamic string interpolation in render.yaml,
        # so set this manually in the dashboard once after first deploy,
        # using the Internal Host shown in the database service page.
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: data-insight-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        # Set to your Render frontend URL after first deploy, e.g.:
        # https://data-insight-frontend.onrender.com
        sync: false

  # React / Vite Frontend (static site)
  - type: web
    name: data-insight-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis
  - type: redis
    name: data-insight-redis
    plan: free

databases:
  # PostgreSQL 16
  - name: data-insight-db
    plan: free
    databaseName: data_insight_db
    user: postgres
